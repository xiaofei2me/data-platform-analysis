[project]
name = "data-platform-analysis"
version = "0.1.0"
description = "采集 DataWorks 和 MaxCompute 数据资产，为 DWS 和 Semantic Layer 设计提供数据基础。"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "alibabacloud-dataworks-public20200518>=10.1.1",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "pyodps>=0.12,<1.0",
    "pyyaml>=6.0,<7.0",
    "rich>=13.9,<15.0",
    "sqlglot>=25.0.0",
    "tenacity>=9.0,<10.0",
]

[project.scripts]
data-platform-analysis = "data_platform_analysis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_platform_analysis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
# 让 `mypy .` 的检查范围与 files = ["src"] 一致：
# - source/ analysis/ output/ 是数据产物（source/ 含采集到的 .py 作业内容）
# - tests/ 由 pytest 覆盖，不在类型检查范围内
exclude = ["^source/", "^analysis/", "^output/", "^tests/"]

[[tool.mypy.overrides]]
module = [
    "odps",
    "odps.*",
    "alibabacloud_dataworks_public20200518",
    "alibabacloud_dataworks_public20200518.*",
    "alibabacloud_tea_openapi",
    "alibabacloud_tea_openapi.*",
    # PyYAML 未提供 py.typed，配置解析只依赖 safe_load。
    "yaml",
    "yaml.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
