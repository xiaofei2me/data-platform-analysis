[project]
name = "data-platform-analysis"
version = "0.1.0"
description = "采集 DataWorks 和 MaxCompute 数据资产，为 DWS 和 Semantic Layer 设计提供数据基础。"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "alibabacloud-dataworks-public20240518>=1.0.0,<2.0.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "pyodps>=0.12,<1.0",
    "rich>=13.9,<15.0",
    "tenacity>=9.0,<10.0",
]

[project.scripts]
data-platform-analysis = "data_platform_analysis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_platform_analysis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]