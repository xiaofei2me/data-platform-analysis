# M3 Business Understanding 业务规则配置（候选识别规则）。
#
# 用途：
#   本文件提供业务词典，供 M3 从表名 / 字段名 / 注释 / SQL / 血缘中匹配业务语义，
#   产出 Domain Candidate、Business Object Candidate 与证据链。
#
# 边界（重要）：
# 1. domains / objects 是「候选识别规则」，不是企业最终业务域标准，也不构成业务结论；
#    业务人员可以随时修改本文件并重新执行 analyze-business。
# 2. stopwords 是技术 token（数仓层级前缀、临时表模板、通用字段词），
#    分词后直接丢弃，不进入 terms / Domain / Object 匹配，
#    因此 dwd_sales_order 中的 dwd 不会被当成业务词。
# 3. 关键词不能同时出现在 stopwords 中（重复视为配置错误，直接报错退出）。
# 4. 匹配一律忽略大小写；中文关键词按子串匹配（不做中文分词）。
#
# 约束：
# - 只被 analyze-business 读取；M2（analyze / analyze-layer）不读取本文件。
# - 配置缺失或非法时 analyze-business 直接报错退出，不回退默认值。

version: "1.0"

# ============================================================
# 技术 token（分词后丢弃）
# ============================================================
# 数仓层级与命名前缀、临时表模板、通用字段词；
# 这些不是业务词，因此既不进入 terms.json，也不参与 Domain / Object 匹配。
stopwords:
  # 层级 / 分层前缀
  - ods
  - cdm
  - ads
  - dwd
  - dws
  - dim
  - dw
  - fct
  - tb
  - s

  # 临时表 / 测试表 / 模板后缀
  - tmp
  - temp
  - test
  - bak
  - copy
  - core
  - od001
  - v
  - v1
  - v2

  # 通用字段词（不含业务语义）
  - id
  - ids
  - code
  - name
  - type
  - time
  - date
  - data
  - num
  # YAML 1.1 会把裸的 no 解析成布尔值，必须加引号。
  - "no"
  - value
  - flag
  - status
  - ds
  - dt
  - ts
  - create
  - update
  - en
  - cn
  - ch
  - fmt

# ============================================================
# Domain 候选识别规则
# ============================================================
# 命中多个 Domain 时全部保留，不擅自选择一个。
domains:
  sales:
    name: 销售
    keywords:
      - sale
      - sales
      - order
      - revenue
      - amount
      - 销售
      - 订单
      - 收入

  customer:
    name: 客户
    keywords:
      - customer
      - cust
      - client
      - 客户

  product:
    name: 产品
    keywords:
      - product
      - material
      - sku
      - 产品
      - 商品

  inventory:
    name: 库存
    keywords:
      - inventory
      - stock
      - warehouse
      - 库存
      - 仓库

# ============================================================
# Business Object 候选识别规则
# ============================================================
# Object 表示「业务对象候选」（客户 / 产品 / 订单 …），
# 不等于 DIM / DWD / DWS，也不要与数仓层混在一起。
objects:
  customer:
    name: 客户
    keywords:
      - customer
      - cust
      - client
      - 客户

  product:
    name: 产品
    keywords:
      - product
      - material
      - sku
      - 产品
      - 商品

  order:
    name: 订单
    keywords:
      - order
      - 订单

  store:
    name: 门店
    keywords:
      - store
      - shop
      - 门店
      - 店铺

  employee:
    name: 员工
    keywords:
      - employee
      - staff
      - 员工
      - 职员
